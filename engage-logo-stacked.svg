<svg xmlns="http://www.w3.org/2000/svg" width="829" height="480" viewBox="0 0 829 480" role="img" aria-labelledby="title desc">
  <title id="title">EngAGE: Calgary Directory for Aging Well</title>
  <desc id="desc">A warm blue and coral wordmark above a hand-drawn Calgary skyline and olive leaves.</desc>

  <!-- Stacked variant of engage-logo.svg for narrow screens: the same artwork,
       with the wordmark centred on top and the skyline-and-leaves motif moved
       underneath instead of sitting beside it. Both groups keep their original
       coordinates and are only translated, so the two files stay in sync if the
       artwork is edited — copy the paths across unchanged. -->

  <g id="wordmark" transform="translate(-64 -111)" font-family="Century Gothic, Avenir Next, Trebuchet MS, Arial, sans-serif">
    <text x="70" y="276" font-size="222" font-weight="700" letter-spacing="-11">
      <tspan fill="#315F7F">Eng</tspan><tspan fill="#F0643C">AGE</tspan>
    </text>
    <text x="78" y="374" fill="#315F7F" font-size="47" font-weight="600" letter-spacing="0.6">Calgary Directory for Aging Well</text>
  </g>

